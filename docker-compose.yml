services:
  backend:
    build:
      context: ./backend
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
    environment:
      - TERRANOVA_DATA_DIR=/app/data
      - CORS_ALLOWED_ORIGINS=http://localhost:${FRONTEND_PORT:-5173},http://127.0.0.1:${FRONTEND_PORT:-5173}

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: http://localhost:8000
    ports:
      # Host port is overridable (FRONTEND_PORT=5174 docker compose up) in case
      # another stack already publishes 5173; CORS origins above follow it.
      - "${FRONTEND_PORT:-5173}:80"
    depends_on:
      - backend
